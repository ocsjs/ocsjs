name: Manual Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 5.6.8 或 v5.6.8；留空则自动从上游获取最新版本号）'
        required: false
        default: ''
        type: string
      upstream_repo:
        description: '上游仓库（留空则自动检测 Fork 来源，默认 ocsjs/ocsjs）'
        required: false
        default: ''
        type: string
      prerelease:
        description: '是否标记为 Pre-release（预发布）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_UPSTREAM: ${{ inputs.upstream_repo }}
          CURRENT_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          VERSION="$(echo "${INPUT_VERSION}" | xargs)"
          UPSTREAM="$(echo "${INPUT_UPSTREAM}" | xargs)"

          if [ -z "${VERSION}" ]; then
            if [ -z "${UPSTREAM}" ]; then
              # 优先自动检测当前仓库的 Fork 上游，非 Fork 时回退为 ocsjs/ocsjs
              UPSTREAM="$(gh api "repos/${CURRENT_REPO}" --jq '.parent.full_name // empty' 2>/dev/null || true)"
              UPSTREAM="${UPSTREAM:-ocsjs/ocsjs}"
            fi

            echo "未输入版本号，正在从上游 ${UPSTREAM} 获取最新版本..."

            # 优先获取上游 Latest Release 的 tag_name
            VERSION="$(gh api "repos/${UPSTREAM}/releases/latest" --jq '.tag_name // empty' 2>/dev/null || true)"

            # 若上游未发布 Release，则回退获取最新的 Git Tag
            if [ -z "${VERSION}" ]; then
              VERSION="$(gh api "repos/${UPSTREAM}/tags" --jq '.[0].name // empty' 2>/dev/null || true)"
            fi

            if [ -z "${VERSION}" ]; then
              echo "::error::无法从上游仓库 ${UPSTREAM} 获取最新版本号，请手动输入或检查上游地址。"
              exit 1
            fi
          fi

          # 统一版本号格式：RAW_VERSION 不带 v（写入 package.json），TAG_NAME 带 v（用于 Release Tag）
          RAW_VERSION="${VERSION#v}"
          RAW_VERSION="${RAW_VERSION#V}"
          TAG_NAME="v${RAW_VERSION}"

          echo "最终版本号 -> RAW_VERSION=${RAW_VERSION}, TAG_NAME=${TAG_NAME}"
          echo "raw_version=${RAW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup pnpm
        run: |
          corepack enable
          if ! node -e "const p = require('./package.json'); process.exit(p.packageManager ? 0 : 1)"; then
            corepack prepare pnpm@9 --activate
          fi
          pnpm -v

      - name: Sync version to package.json
        env:
          RAW_VERSION: ${{ steps.version.outputs.raw_version }}
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const version = process.env.RAW_VERSION;

            const targets = ["package.json"];
            if (fs.existsSync("packages")) {
              for (const dir of fs.readdirSync("packages")) {
                const pkgPath = path.join("packages", dir, "package.json");
                if (fs.existsSync(pkgPath)) targets.push(pkgPath);
              }
            }

            for (const file of targets) {
              const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
              pkg.version = version;
              fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
              console.log(`Updated ${file} -> ${version}`);
            }
          '

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build project
        run: |
          set -euo pipefail

          # 1. 先编译 packages/utils，生成 scripts/build-core.js 依赖的 lib/index.js
          if node -e "const s = require('./packages/utils/package.json').scripts || {}; process.exit(s.build ? 0 : 1)"; then
            pnpm --dir packages/utils run build
          elif node -e "const s = require('./package.json').scripts || {}; process.exit(s['build:utils'] ? 0 : 1)"; then
            pnpm run build:utils
          fi

          # 兜底：若未定义上述脚本或仍未产出 lib/index.js，直接使用 tsc 编译
          if [ ! -f "packages/utils/lib/index.js" ]; then
            pnpm exec tsc -p packages/utils/tsconfig.json
          fi

          # 2. 执行主构建
          pnpm run build

      - name: Collect release assets
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p release-assets

          # 优先收集根目录 dist/ 下的构建产物（排除 source map 和类型声明，避免同名覆盖）
          if [ -d "dist" ]; then
            find dist -maxdepth 3 -type f ! -name "*.map" ! -name "*.d.ts" | while IFS= read -r file; do
              base="$(basename "${file}")"
              if [ -e "release-assets/${base}" ]; then
                parent="$(basename "$(dirname "${file}")")"
                cp "${file}" "release-assets/${parent}-${base}"
              else
                cp "${file}" "release-assets/${base}"
              fi
            done
          fi

          # 若根目录 dist/ 无文件，则回退收集 packages/*/dist 下的脚本与样式产物
          if [ -z "$(ls -A release-assets)" ]; then
            for subdist in packages/*/dist; do
              if [ -d "${subdist}" ]; then
                pkg_name="$(basename "$(dirname "${subdist}")")"
                find "${subdist}" -maxdepth 3 -type f \( -name "*.js" -o -name "*.css" -o -name "*.zip" \) | while IFS= read -r file; do
                  base="$(basename "${file}")"
                  if [ -e "release-assets/${base}" ]; then
                    cp "${file}" "release-assets/${pkg_name}-${base}"
                  else
                    cp "${file}" "release-assets/${base}"
                  fi
                done
              fi
            done
          fi

          if [ -z "$(ls -A release-assets)" ]; then
            echo "::error::未在 dist/ 或 packages/*/dist/ 找到构建产物，请检查实际输出路径。"
            exit 1
          fi

          # 额外打包一份压缩包方便一次性下载
          tar -czf "ocsjs-${TAG_NAME}.tar.gz" -C release-assets .
          mv "ocsjs-${TAG_NAME}.tar.gz" release-assets/

          ls -lh release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Release ${{ steps.version.outputs.tag_name }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
